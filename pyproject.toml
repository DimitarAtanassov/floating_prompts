[project]
name = "floating-prompts"
version = "0.1.0"
description = "Database layer for ModeloKit - PostgreSQL with SQLAlchemy"
readme = "README.md"
authors = [
    { name = "DimitarAtanassov", email = "dimitar789558@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.40",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.15.0",
    "python-dotenv>=1.2.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
]

[project.scripts]
floating-prompts = "floating_prompts.cli:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]
lint = [
    "mypy>=1.19.1",
    "ruff>=0.14.10",
]

[tool.uv]
native-tls = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "C90",    # Mccabe complexity
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-ASYNC
    "S",      # flake8-bandit
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "PT",     # flake8-pyteststyle
    "PL",     # pylint
    "PERF",   # perflint
]
ignore = [
    "PLR2004",  # Magic values in comparisons
    "W291",     # Trailing whitespace
    "W292",     # No newline at end of file
    "W293",     # Blank line contains whitespace
    "E501",     # Line too long
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80